<!doctype html>
<html>
  <head>
    <!-- The settings page uses the Homey styling by default -->
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  </head>
  <body>
    <h1 data-i18n="settings.title">Eplucon Settings</h1>
    
    <fieldset>
      <legend data-i18n="settings.auth">Authentication</legend>
      
      <div class="field row">
        <label for="username" data-i18n="settings.username">Username</label>
        <input id="username" type="text" value="" />
      </div>
      
      <div class="field row">
        <label for="password" data-i18n="settings.password">Password</label>
        <input id="password" type="password" value="" />
      </div>
      
      <button id="save" class="button-primary" data-i18n="settings.save">Save</button>
    </fieldset>

    <script type="text/javascript">
      function onHomeyReady(Homey) {
        Homey.ready();
        
        // Get current settings
        Homey.get('username', function(err, username) {
          if( err ) return console.error(err);
          document.getElementById('username').value = username || '';
        });

        // Save button
        document.getElementById('save').addEventListener('click', function() {
          var username = document.getElementById('username').value;
          var password = document.getElementById('password').value;
          
          Homey.set('username', username, function(err) {
            if( err ) return Homey.alert(err);
            
            // Don't store password in plain text in settings if possible, 
            // but for this v1 we pass it to backend to store securely or use directly.
            // Best practice: Send to backend, backend authenticates and stores token.
            Homey.api('POST', '/login', { username, password }, function(err, result) {
               if(err) return Homey.alert('Login failed: ' + err);
               Homey.alert('Settings saved & Authenticated!');
            });
          });
        });
      }
    </script>
  </body>
</html>
